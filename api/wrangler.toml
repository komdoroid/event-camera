name = "event-camera-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://event-camera.kom-commoc.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "event-camera"
database_id = "4e8d2268-7c16-484d-ab64-41a989058262" # 本番の D1。--local では無視される
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "event-camera-photos"
